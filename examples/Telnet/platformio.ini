; BlackBox telnet example: logging over WiFi
;
; BlackBox settings must reach the library's own source files, so they go here as build flags
; (or in a config.h on the include path), not as #defines in main.cpp.

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = symlink://../..
build_flags =
    -D BLACKBOX_SINK_TELNET=1
    -D BLACKBOX_HOSTNAME=\"blackbox-demo\"
